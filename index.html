<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>残响工坊</title>
<meta name="description" content="被困在午夜循环的雾镇里，靠死亡积累记忆，靠别人留下的残响前进。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/play.css">
<link rel="stylesheet" href="src/styles/menus.css">
</head>
<body class="game-page">
<header class="top">
  <div class="brand">
    <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 2 C9 2 6 7 6 13 L6 22 L3 26 L27 26 L24 22 L24 13 C24 7 21 2 15 2 Z" fill="none" stroke="#d9a653" stroke-width="1.6"/><circle cx="15" cy="29.5" r="2.6" fill="#f0c77e"/><path d="M1 12 Q-1 17 1 22 M29 12 Q31 17 29 22" stroke="#8fa3b8" stroke-width="1.2" fill="none" opacity=".7"/></svg>
    <h1>残响工坊</h1><span class="proj" id="projName"></span>
  </div>
</header>

<!-- 入局 -->
<section class="view" id="v-play" hidden>
  <div class="play">
    <div class="game">
      <div class="stage" id="stage">
        <canvas id="art" aria-label="游戏场景：用方向键移动角色，空格与附近的东西互动"></canvas>
        <div class="fog"></div><div class="fog f2"></div>
        <div class="sky" id="sky" aria-label="残响"></div>
        <div class="vignette"></div>
        <div class="hud" id="hud"></div>
        <div class="pad" id="pad"><button data-pad="l" aria-label="向左走">◀</button><button data-pad="r" aria-label="向右走">▶</button></div>
        <button class="pad-act" data-pad="act" aria-label="互动">互动</button>
        <div class="menu" id="menu" hidden role="menu"></div>
        <div class="fader" id="fader"></div>
        <div class="verdict" id="verdict" hidden></div>
      </div>
      <div class="dialog" id="dialog"></div>
    </div>
    <aside class="side" id="pside"></aside>
  </div>
</section>

<!-- 标题画面 -->
<section class="title-screen" id="title" hidden>
  <canvas id="titleArt" aria-hidden="true"></canvas>
  <div class="fog"></div><div class="fog f2"></div>
  <div class="title-shade"></div>
  <div class="title-inner">
    <h1 class="title-word" aria-label="残响"><span>残响</span><span class="ghost g1" aria-hidden="true">残响</span><span class="ghost g2" aria-hidden="true">残响</span></h1>
    <p class="title-sub" id="titleSub"></p>
    <p class="title-tag">被困在午夜的雾镇里。每一次死去，都会留下一句话。</p>
    <div class="menu-list" id="titleMenu" role="menu" aria-label="标题菜单"></div>
    <p class="title-save" id="titleSave" aria-live="polite"></p>
  </div>
  <p class="title-keys"><kbd>↑</kbd><kbd>↓</kbd> 选择　<kbd>空格</kbd> 确认</p>
</section>

<!-- 暂停菜单 -->
<div class="overlay" id="pause" hidden>
  <div class="overlay-card slab" role="dialog" aria-label="暂停">
    <h3>暂停</h3>
    <div class="menu-list" id="pauseMenu" role="menu"></div>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="settingsPanel" hidden>
  <div class="overlay-card slab" role="dialog" aria-label="设置">
    <h3>设置</h3>
    <div class="settings" id="settingsBody"></div>
    <div class="menu-list" id="settingsDone" role="menu"></div>
  </div>
</div>

<script type="module" src="src/game-main.js"></script>
</body>
</html>
